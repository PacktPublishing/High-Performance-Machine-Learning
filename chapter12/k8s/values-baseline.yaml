# llm-d 1.0 values sketch for 4 vLLM decode pods serving Qwen3-VL-8B-Instruct-FP8.
# Check every key against the chart's values.yaml for the release you install.
modelArtifacts:
  uri: hf://Qwen/Qwen3-VL-8B-Instruct-FP8
  authSecretName: hf-token
decode:
  replicas: 4
  containers:
    - name: vllm
      image: vllm/vllm-openai:v0.33.0
      args:
        - --max-model-len=32768
        - --enable-prefix-caching
        - --enable-prompt-tokens-details
        - --enable-auto-tool-choice
        - --tool-call-parser=hermes
        - --kv-cache-dtype=fp8
        - '--mm-processor-kwargs={"max_pixels":1310720}'
      resources:
        limits: {nvidia.com/gpu: 1}
router:
  scorers: [load-aware]
